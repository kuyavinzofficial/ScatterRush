<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScatterRush V4</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🎰 ScatterRush 🎰</h1>

</div>

<div class="card">

<br>

</div>


<div id="gameBoard">

<div class="cell"><img id="cell1" class="slotImage"></div>
<div class="cell"><img id="cell2" class="slotImage"></div>

<div class="cell"><img id="cell10" class="slotImage"></div>

<div class="cell"><img id="cell12" class="slotImage"></div>

<div id="controls">

<button onclick="dailyBonus()">🎁 BONUS</button>

<button onclick="openShop()">🛒 SHOP</button>

</div>

<p id="message"></p>

</div>

<script src="script.js"></script>

</html>

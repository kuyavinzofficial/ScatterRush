<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScatterRush</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h1>🎰 ScatterRush</h1>

<div id="stats">

<div class="card">
Coins
<br>
<span id="coins">1000</span>
</div>

<div class="card">
XP
<br>
<span id="xp">0</span>
</div>

<div class="card">
Level
<br>
<span id="level">1</span>
</div>

</div>


<div id="reels">

<div class="reel">
<img id="reel1" class="slotImage"
src="assets/symbols/ivana.png">
</div>

<div class="reel">
<img id="reel2" class="slotImage"
src="assets/symbols/feheng.png">
</div>

<div class="reel">
<img id="reel3" class="slotImage"
src="assets/symbols/hapon.png">
</div>

</div>


<button onclick="spin()">
🎰 SPIN
</button>

<button onclick="dailyBonus()">
🎁 DAILY BONUS
</button>

<button onclick="openShop()">
🛒 SHOP
</button>


<p id="message"></p>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>ScatterRush</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.spin:hover {

    box-shadow:
    0 0 30px gold;

    transform:scale(1.05);

}


.spin:active {

    animation:buttonPress .2s;

}


@keyframes buttonPress {

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(.85);
    }

    100%{
        transform:scale(1);
    }

}
*{
    box-sizing:border-box;
}

body {
    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at top,#4b3a00,#050505 60%);
    color:white;
    font-family:'Arial',sans-serif;
}


.container {
    max-width:450px;
    margin:auto;
    padding:20px;
}


h1 {
    font-size:45px;
    color:#ffd700;
    letter-spacing:2px;
    text-shadow:
    0 0 10px #ffd700,
    0 0 25px orange;
}


.coins {
    background:#111;
    border:2px solid #ffd700;
    border-radius:20px;
    padding:12px;
    font-size:25px;
    margin:20px 0;
    box-shadow:0 0 15px gold;
}


.machine {

    background:
    linear-gradient(145deg,#222,#000);

    border:8px solid #d4af37;

    border-radius:35px;

    padding:35px 20px;

    box-shadow:
    0 0 20px gold,
    inset 0 0 20px #333;

}


.reels {

    display:flex;
    justify-content:center;
    gap:12px;

}


.reel {

    width:90px;
    height:90px;

    background:
    linear-gradient(#fff,#ddd);

    color:black;

    border-radius:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:50px;

    box-shadow:
    inset 0 0 10px #999,
    0 0 15px white;

}


.spin {

    margin-top:35px;

    width:80%;

    padding:18px;

    font-size:28px;

    font-weight:bold;

    color:#000;

    background:
    linear-gradient(#ffe66d,#ffb700);

    border:none;

    border-radius:25px;

    box-shadow:
    0 0 20px gold;

}


.spin:active {

    transform:scale(.92);

}


#message {

    margin-top:25px;

    min-height:45px;

    font-size:28px;

    font-weight:bold;

    color:#ffd700;

    text-shadow:
    0 0 10px gold;

}


.win {
    animation: winEffect 0.5s infinite alternate;
}

@keyframes winEffect {

    from {
        transform:scale(1);
    }

    to {
        transform:scale(1.15);
    }

}


.shake {

    animation:shake 0.2s infinite;

}


@keyframes shake {

    0% {
        transform:translateX(0);
    }

    25% {
        transform:translateX(-5px);
    }

    50% {
        transform:translateX(5px);
    }

    75% {
        transform:translateX(-5px);
    }

    100% {
        transform:translateX(0);
    }

}

</head>

<body>

<div class="container">

<h1>🎰 ScatterRush</h1>

<div class="coins">
🪙 Coins: <span id="coins"></span>
</div>


<div class="machine">

<div class="reels">

<div class="reel" id="r1">❓</div>
<div class="reel" id="r2">❓</div>
<div class="reel" id="r3">❓</div>

</div>


<button class="spin" onclick="spin()">
SPIN
</button>


<div id="message"></div>

</div>

</div>



<script>

let coins = localStorage.getItem("scatterCoins");

if(coins == null){
    coins = 1000;
}

coins = Number(coins);

document.getElementById("coins").innerHTML = coins;


let symbols = [
"🍒",
"🍋",
"🍉",
"⭐",
"💎",
"7️⃣"
];


function spin(){

    if(coins < 10){

        document.getElementById("message").innerHTML =
        "❌ Not enough coins";

        return;
    }


    coins -= 10;

    document.getElementById("coins").innerHTML = coins;


    let r1=document.getElementById("r1");
    let r2=document.getElementById("r2");
    let r3=document.getElementById("r3");


    let spins = 0;


    let timer=setInterval(function(){


        r1.innerHTML=randomSymbol();
        r2.innerHTML=randomSymbol();
        r3.innerHTML=randomSymbol();


        spins++;


        if(spins >= 20){

            clearInterval(timer);

            checkResult();

        }


    },100);


}


function randomSymbol(){

    return symbols[Math.floor(Math.random()*symbols.length)];

}



function checkResult(){

    let a=document.getElementById("r1").innerHTML;
    let b=document.getElementById("r2").innerHTML;
    let c=document.getElementById("r3").innerHTML;

    let message="";
    
    let reels = document.querySelector(".reels");
    let allReels = document.querySelectorAll(".reel");


    if(a==b && b==c){

        coins += 500;

        message="🎉 JACKPOT! +500 Coins";

        reels.classList.add("shake");

        allReels.forEach(function(item){
            item.classList.add("win");
        });


    }

    else if(a==b || a==c || b==c){

        coins += 50;

        message="✨ BIG WIN! +50 Coins";

        allReels.forEach(function(item){
            item.classList.add("win");
        });


    }

    else{

        message="😢 TRY AGAIN";

    }


    document.getElementById("coins").innerHTML=coins;

    document.getElementById("message").innerHTML=message;


    localStorage.setItem("scatterCoins",coins);


    setTimeout(function(){

        reels.classList.remove("shake");

        allReels.forEach(function(item){

            item.classList.remove("win");

        });

    },2000);


}


</script>


</body>
    <audio id="spinSound" src="https://actions.google.com/sounds/v1/foley/metal_clang.ogg"></audio>

<audio id="winSound" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

<audio id="jackpotSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
</html>

<!DOCTYPE html>
<html>

<head>

<title>ScatterRush Ultimate</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle,#5b4300,#050505 70%);

font-family:Arial,sans-serif;

color:white;

text-align:center;

}



.container{

max-width:450px;

margin:auto;

padding:20px;

}



h1{

font-size:42px;

color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 30px orange;

}



.card{

background:#111;

border:3px solid gold;

border-radius:25px;

padding:15px;

margin:15px 0;

box-shadow:0 0 20px gold;

}



.machine{

background:
linear-gradient(145deg,#222,#000);

border:8px solid #d4af37;

border-radius:35px;

padding:30px 15px;

box-shadow:
0 0 25px gold,
inset 0 0 20px #555;

}



.reels{

display:flex;

justify-content:center;

gap:10px;

}



.reel{

width:85px;

height:85px;

background:white;

color:black;

border-radius:18px;

display:flex;

align-items:center;

justify-content:center;

font-size:45px;

}



button,
select{

width:90%;

padding:15px;

margin:8px;

font-size:20px;

font-weight:bold;

border-radius:20px;

border:none;

background:
linear-gradient(#ffe66d,#ff9900);

}



button:active{

transform:scale(.9);

}



#message{

font-size:25px;

color:#ffd700;

min-height:40px;

}



.win{

animation:win .5s infinite alternate;

}



@keyframes win{

from{

transform:scale(1);

}

to{

transform:scale(1.15);

}

}



.shake{

animation:shake .2s infinite;

}



@keyframes shake{

0%{transform:translateX(0)}

25%{transform:translateX(-5px)}

50%{transform:translateX(5px)}

75%{transform:translateX(-5px)}

100%{transform:translateX(0)}

}



.hidden{

display:none;

}


</style>


</head>


<body>


<div class="container">


<h1>🎰 ScatterRush</h1>


<div class="card">

🪙 Coins:
<span id="coins">1000</span>

<br>

⭐ Level:
<span id="level">1</span>

<br>

🔥 XP:
<span id="xp">0</span>

</div>



<div class="machine">


<div class="reels">


<div class="reel" id="r1">❓</div>

<div class="reel" id="r2">❓</div>

<div class="reel" id="r3">❓</div>


</div>



<button onclick="spin()">

🎰 SPIN

</button>


<select id="mode">

<option value="classic">
🎰 Classic Rush
</option>

<option value="diamond">
💎 Diamond Rush
</option>

<option value="seven">
7️⃣ Lucky Seven
</option>

</select>


<div id="message"></div>


</div>
<div class="card">

<button onclick="dailyBonus()">
🎁 DAILY BONUS
</button>

<button onclick="openShop()">
🛒 SHOP
</button>

</div>



<div id="shop" class="card hidden">
<div id="shop" class="card hidden">

<h2>🛒 ScatterRush Shop</h2>

<p>Buy Coins</p>


<button onclick="purchase(1000)">
🪙 1,000 Coins
<br>
₱49
</button>


<button onclick="purchase(5000)">
🪙 5,000 Coins
<br>
₱199
</button>


<button onclick="purchase(10000)">
🪙 10,000 Coins
<br>
₱399
</button>


<button onclick="closeShop()">
❌ Close Shop
</button>


</div>


<div class="card">

<h3>🏆 Achievements</h3>

<div id="achievements">
None yet
</div>

</div>



</div>



<audio id="spinSound"
src="https://actions.google.com/sounds/v1/foley/metal_clang.ogg">
</audio>


<audio id="winSound"
src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg">
</audio>


<audio id="jackpotSound"
src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>



<script>


let coins =
Number(localStorage.getItem("scatterCoins")) || 1000;


let level =
Number(localStorage.getItem("scatterLevel")) || 1;


let xp =
Number(localStorage.getItem("scatterXP")) || 0;



let achievements =
JSON.parse(localStorage.getItem("achievements")) || [];



let symbols=[

"🍒",
"🍋",
"🍉",
"⭐",
"💎",
"7️⃣"

];



function updateUI(){

document.getElementById("coins").innerHTML=coins;

document.getElementById("level").innerHTML=level;

document.getElementById("xp").innerHTML=xp;


document.getElementById("achievements").innerHTML =
achievements.length ?
achievements.join("<br>") :
"None yet";

}



updateUI();




function unlock(name){

if(!achievements.includes(name)){

achievements.push(name);

localStorage.setItem(
"achievements",
JSON.stringify(achievements)

);

}

updateUI();

}




function randomSymbol(){

return symbols[
Math.floor(Math.random()*symbols.length)
];

}




function spin(){


unlock("🎰 First Spin");


let mode=document.getElementById("mode").value;


let cost=10;


if(mode=="diamond") cost=25;

if(mode=="seven") cost=50;



if(coins<cost){

document.getElementById("message").innerHTML=
"❌ Not enough coins";

return;

}



document.getElementById("spinSound").play();



coins-=cost;


let a=document.getElementById("r1");

let b=document.getElementById("r2");

let c=document.getElementById("r3");



let count=0;



let roll=setInterval(function(){


a.innerHTML=randomSymbol();

b.innerHTML=randomSymbol();

c.innerHTML=randomSymbol();


count++;


if(count>=20){

clearInterval(roll);

result(mode);

}


},100);



}




function result(mode){


let a=document.getElementById("r1").innerHTML;

let b=document.getElementById("r2").innerHTML;

let c=document.getElementById("r3").innerHTML;


let gainXP=5;

let msg="";


if(a==b && b==c){


unlock("💰 First Jackpot");


if(mode=="classic")
coins+=500;


if(mode=="diamond")
coins+=1000;


if(mode=="seven")
coins+=2500;


gainXP=50;


msg="🎉 JACKPOT!";


document.getElementById("jackpotSound").play();


document.querySelector(".reels")
.classList.add("shake");


}


else if(a==b || a==c || b==c){


if(mode=="classic")
coins+=50;


if(mode=="diamond")
coins+=150;


if(mode=="seven")
coins+=300;



gainXP=20;


msg="✨ BIG WIN";


document.getElementById("winSound").pla();


}



xp+=gainXP;



if(xp>=level*100){

xp=0;

level++;

msg+=" 🆙 LEVEL UP!";

unlock("⭐ Level Up");

}



localStorage.setItem("scatterCoins",coins);

localStorage.setItem("scatterXP",xp);

localStorage.setItem("scatterLevel",level);



document.getElementById("message").innerHTML=msg;


updateUI();



setTimeout(function(){

document.querySelector(".reels")
.classList.remove("shake");

},2000);


}function dailyBonus(){

let today = new Date().toDateString();

let last =
localStorage.getItem("dailyBonus");


if(last==today){

document.getElementById("message").innerHTML =
"🎁 Bonus already claimed!";

return;

}


coins+=500;


localStorage.setItem(
"scatterCoins",
coins
);


localStorage.setItem(
"dailyBonus",
today
);


document.getElementById("message").innerHTML =
"🎉 Daily Bonus +500 Coins";


updateUI();

}





function openShop(){

document.getElementById("shop")
.classList.remove("hidden");

}




function closeShop(){

document.getElementById("shop")
.classList.add("hidden");

}




function purchase(amount){

let confirmBuy =
confirm(
"Purchase "+amount+" Coins?"
);


if(confirmBuy){


document.getElementById("message").innerHTML =
"💳 Payment processing...";


setTimeout(function(){


coins += amount;


localStorage.setItem(
"scatterCoins",
coins
);


document.getElementById("message").innerHTML =
"✅ Coins Added!";


updateUI();


},1500);


}


  }



function changeTheme(theme){


let machine =
document.querySelector(".machine");



if(theme=="gold"){

machine.style.borderColor="gold";

machine.style.boxShadow=
"0 0 30px gold";

}



if(theme=="diamond"){

machine.style.borderColor="cyan";

machine.style.boxShadow=
"0 0 30px cyan";

}




if(theme=="neon"){

machine.style.borderColor="magenta";

machine.style.boxShadow=
"0 0 30px magenta";

}



localStorage.setItem(
"theme",
theme
);


document.getElementById("message").innerHTML =
"🎨 Theme Changed";


}




let savedTheme =
localStorage.getItem("theme");


if(savedTheme){

changeTheme(savedTheme);

}



</script>


</body>

</html>

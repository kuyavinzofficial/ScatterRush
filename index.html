<!DOCTYPE html>
<html>
<head>
<title>ScatterRush</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin:0;
    padding:0;
    background:radial-gradient(circle,#444,#000);
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container {
    max-width:420px;
    margin:auto;
    padding:20px;
}

h1 {
    color:#ffd700;
    font-size:40px;
    text-shadow:0 0 15px gold;
}

.coins {
    font-size:24px;
    margin:20px;
}

.machine {
    background:#111;
    border:5px solid #ffd700;
    border-radius:25px;
    padding:25px;
    box-shadow:0 0 25px gold;
}

.reels {
    display:flex;
    justify-content:center;
    gap:10px;
}

.reel {
    width:80px;
    height:80px;
    background:white;
    color:black;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
}

.spin {
    margin-top:30px;
    padding:15px 60px;
    font-size:25px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    background:#ffd700;
}

#message {
    margin-top:20px;
    font-size:25px;
    min-height:40px;
}

</style>

</head>

<body>

<div class="container">

<h1>🎰 ScatterRush</h1>

<div class="coins">
🪙 Coins: <span id="coins"></span>
</div>


<div class="machine">

<div class="reels">

<div class="reel" id="r1">❓</div>
<div class="reel" id="r2">❓</div>
<div class="reel" id="r3">❓</div>

</div>


<button class="spin" onclick="spin()">
SPIN
</button>


<div id="message"></div>

</div>

</div>



<script>

let coins = localStorage.getItem("scatterCoins");

if(coins == null){
    coins = 1000;
}

coins = Number(coins);

document.getElementById("coins").innerHTML = coins;


let symbols = [
"🍒",
"🍋",
"🍉",
"⭐",
"💎",
"7️⃣"
];


function spin(){

    if(coins < 10){

        document.getElementById("message").innerHTML =
        "❌ Not enough coins";

        return;
    }


    coins -= 10;

    document.getElementById("coins").innerHTML = coins;


    let r1=document.getElementById("r1");
    let r2=document.getElementById("r2");
    let r3=document.getElementById("r3");


    let spins = 0;


    let timer=setInterval(function(){


        r1.innerHTML=randomSymbol();
        r2.innerHTML=randomSymbol();
        r3.innerHTML=randomSymbol();


        spins++;


        if(spins >= 20){

            clearInterval(timer);

            checkResult();

        }


    },100);


}


function randomSymbol(){

    return symbols[Math.floor(Math.random()*symbols.length)];

}



function checkResult(){

    let a=document.getElementById("r1").innerHTML;
    let b=document.getElementById("r2").innerHTML;
    let c=document.getElementById("r3").innerHTML;


    let message="";


    if(a==b && b==c){

        coins += 500;
        message="🎉 JACKPOT! +500 Coins";

    }

    else if(a==b || a==c || b==c){

        coins += 50;
        message="✨ WIN! +50 Coins";

    }

    else{

        message="😢 TRY AGAIN";

    }


    document.getElementById("coins").innerHTML=coins;

    document.getElementById("message").innerHTML=message;


    localStorage.setItem("scatterCoins",coins);

}


</script>


</body>
</html>

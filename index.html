<!DOCTYPE html>
<html>
<head>

<title>ScatterRush</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
min-height:100vh;

background:
radial-gradient(circle,#5b4300,#050505 70%);

font-family:Arial,sans-serif;

color:white;

text-align:center;

}


.container{

max-width:450px;

margin:auto;

padding:20px;

}


h1{

font-size:45px;

color:#ffd700;

text-shadow:
0 0 10px gold,
0 0 30px orange;

}


.coins{

background:#111;

border:3px solid gold;

border-radius:20px;

padding:15px;

font-size:25px;

margin-bottom:25px;

box-shadow:0 0 20px gold;

}



.machine{

background:

linear-gradient(145deg,#222,#000);

border:8px solid #d4af37;

border-radius:35px;

padding:30px 20px;

box-shadow:

0 0 25px gold,

inset 0 0 20px #555;

}



.reels{

display:flex;

justify-content:center;

gap:12px;

}


.reel{

width:90px;

height:90px;

background:white;

color:black;

border-radius:20px;

display:flex;

justify-content:center;

align-items:center;

font-size:50px;

box-shadow:

inset 0 0 15px #999,

0 0 15px white;

}



.spin{

margin-top:35px;

width:85%;

padding:18px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:25px;

background:

linear-gradient(#ffe66d,#ff9900);

box-shadow:

0 0 25px gold;

}



.spin:active{

transform:scale(.9);

}



#message{

margin-top:25px;

font-size:28px;

font-weight:bold;

color:#ffd700;

text-shadow:0 0 10px gold;

}



.win{

animation:win .5s infinite alternate;

}



@keyframes win{

from{

transform:scale(1);

}

to{

transform:scale(1.15);

}

}



.shake{

animation:shake .2s infinite;

}



@keyframes shake{

0%{

transform:translateX(0);

}

25%{

transform:translateX(-5px);

}

50%{

transform:translateX(5px);

}

75%{

transform:translateX(-5px);

}

100%{

transform:translateX(0);

}

}


</style>

</head>


<body><div class="container">

<h1>🎰 ScatterRush</h1>


<div class="coins">

🪙 Coins:
<span id="coins">1000</span>

<br>

⭐ Level:
<span id="level">1</span>

<br>

🔥 XP:
<span id="xp">0</span>

</div>


<select id="gameMode" onchange="changeMachine()">

<option value="classic">
🎰 Classic Rush
</option>

<option value="diamond">
💎 Diamond Rush
</option>

<option value="seven">
7️⃣ Lucky Seven
</option>

</select>
<div class="machine">


<div class="reels">


<div class="reel" id="r1">
❓
</div>


<div class="reel" id="r2">
❓
</div>


<div class="reel" id="r3">
❓
</div>


</div>



<button class="spin" onclick="spin()">

SPIN

</button>
<button class="spin" onclick="dailyBonus()">

🎁 DAILY BONUS

</button>

<div id="message">

</div>


</div>


</div>



<audio id="spinSound"
src="https://actions.google.com/sounds/v1/foley/metal_clang.ogg">
</audio>


<audio id="winSound"
src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg">
</audio>


<audio id="jackpotSound"
src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>



<script>
function dailyBonus(){

let today = new Date().toDateString();

let lastBonus = localStorage.getItem("lastBonus");


if(lastBonus == today){

document.getElementById("message").innerHTML =
"🎁 Bonus already claimed today!";

return;

}


coins += 500;
xp += gainedXP;


if(xp >= level * 100){

xp = 0;

level++;

message += " 🆙 LEVEL UP!";

}


localStorage.setItem("scatterXP",xp);

localStorage.setItem("scatterLevel",level);


document.getElementById("xp").innerHTML=xp;

document.getElementById("level").innerHTML=level;

localStorage.setItem("scatterCoins",coins);

localStorage.setItem("lastBonus",today);


document.getElementById("coins").innerHTML=coins;


document.getElementById("message").innerHTML =
"🎉 Daily Bonus +500 Coins!";


}

let coins = localStorage.getItem("scatterCoins");
let level = Number(localStorage.getItem("scatterLevel")) || 1;

let xp = Number(localStorage.getItem("scatterXP")) || 0;

if(coins === null){

coins = 1000;

}

else{

coins = Number(coins);

}



document.getElementById("coins").innerHTML = coins;



let symbols=[
let mode = "classic";
"🍒",
"🍋",
"🍉",
"⭐",
"💎",
"7️⃣"

];



function randomSymbol(){

return symbols[Math.floor(Math.random()*symbols.length)];

}



function changeMachine(){

mode = document.getElementById("gameMode").value;


document.getElementById("message").innerHTML =
"🎰 " + mode.toUpperCase() + " MODE";

}
function spin(){



if(coins < 10){

document.getElementById("message").innerHTML =
"❌ Not enough coins";

return;

}



document.getElementById("spinSound").play();



coins -= 10;


document.getElementById("coins").innerHTML=coins;
document.getElementById("level").innerHTML = level;

document.getElementById("xp").innerHTML = xp;


let r1=document.getElementById("r1");

let r2=document.getElementById("r2");

let r3=document.getElementById("r3");



let count=0;



let animation=setInterval(function(){


r1.innerHTML=randomSymbol();

r2.innerHTML=randomSymbol();

r3.innerHTML=randomSymbol();



count++;



if(count>=20){


clearInterval(animation);


checkResult();


}



},100);



}




function checkResult(){



let a=document.getElementById("r1").innerHTML;

let b=document.getElementById("r2").innerHTML;

let c=document.getElementById("r3").innerHTML;



let reels=document.querySelector(".reels");

let all=document.querySelectorAll(".reel");

let message="";

let gainedXP = 5;

if(a==b && b==c){



coins += 500;


message="🎉 JACKPOT! +500";

gainedXP = 50;
document.getElementById("jackpotSound").play();


reels.classList.add("shake");


all.forEach(function(x){

x.classList.add("win");

});



}

else if(a==b || a==c || b==c){



coins += 50;
gainedXP = 20;

message="✨ BIG WIN! +50";


document.getElementById("winSound").play();



all.forEach(function(x){

x.classList.add("win");

});



}

else{


message="😢 TRY AGAIN";


}



document.getElementById("coins").innerHTML=coins;


document.getElementById("message").innerHTML=message;



localStorage.setItem("scatterCoins",coins);



setTimeout(function(){


reels.classList.remove("shake");


all.forEach(function(x){

x.classList.remove("win");

});


},2000);



}



</script></body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scatter Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

    <h1>SCATTER GAME</h1>

    <div class="info-panel">
      <div>
    <span>Free Spins</span>
    <strong id="freeSpins">0</strong>
      </div>  <div>
            <span>Balance</span>
            <strong id="balance">1000</strong>
        </div>

        <div>
            <span>Bet</span>
            <strong id="bet">10</strong>
        </div>

        <div>
            <span>Win</span>
            <strong id="win">0</strong>
        </div>
    </div>


    <div class="slot-machine">

        <div class="reel" id="reel1">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
        </div>

        <div class="reel" id="reel2">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
        </div>

        <div class="reel" id="reel3">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
        </div>

        <div class="reel" id="reel4">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
        </div>

        <div class="reel" id="reel5">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
            <img src="symbols/apple.png">
        </div>

    </div>


    <div class="lines">
        <p>Paylines:</p>
        <span>Line 1</span>
        <span>Line 2</span>
        <span>Line 3</span>
    </div>


    <button id="spinButton">
        SPIN
    </button>


    <div id="message">
        Good Luck!
    </div>


</div>


<script src="script.js"></script>

</body>
  </html>
